<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .gridContainer1{
            display: grid;
            grid-template-columns: 200px 75px;
        }

        .box1{
            background-color: lightblue;
        }
        .box2{
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="gridContainer1">
        <div class="box1">
            200px
        </div>
        <div class="box2">
            75px
        </div>
    </div>

    <div class="gridContainer2" style="
    display: grid;
    grid-template-columns: 50px 1fr 75px;">
        <div class="col1" style="
        background-color: lightblue;">
            col1
        </div>
        <div class="col2" style="
        background-color: pink;">
            col2
        </div>
        <div class="col3" style="
        background-color: lightblue;">
            col3
        </div>
    </div>
</body>
</html>

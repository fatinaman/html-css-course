<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .a{
            width: 200px;
            border-radius: 20px;
        }
        .b{
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }
        .c{
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
        }
    </style>
    <title>Cat Image</title>
</head>
<body>
    <img class ="a" src="cool-cat.jpg" alt="Image_of_a_cool_cat">
    <img class ="b" src="cool-cat.jpg" alt="Image_of_a_cool_cat">
    <img class ="c" src="cool-cat.jpg" alt="Image_of_a_cool_cat">
</body>
</html>

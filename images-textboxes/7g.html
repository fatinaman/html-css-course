<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Box</title>
    <style>
        body{
            display: flex;        
            align-items: center;
            gap: 12px;
        }
        img{
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }

        input{
            border-style: none;
        }
        button{
            background-color: rgb(10, 126, 194);
            color: white;
            padding: 4px 9px;
            border-style: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <img src="cool-cat.jpg" alt="profile pic of cool cat">
    <input type="text" placeholder="What's happening?">
    <button>Tweet</button>
</body>
</html>

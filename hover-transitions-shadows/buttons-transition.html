<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        button{
            padding: 10px 15px;
            margin: 0 10px;
        }
        #subscribeBtn{
            background-color: red;
            color: white;
            border-style: none;
            border-radius: 3px;
            font-weight: bold;
            transition: background-color 1s;
        }
        #joinBtn{
            background-color: white;
            border: 2px solid rgb(43, 168, 226);
            border-radius: 3px;
            color: rgb(43, 168, 226);
            font-weight: bold;
            transition: background-color 1s,color 1s;
        }
        #tweetBtn{
            background-color: rgb(77, 175, 236);
            border-style: none;
            color: white;
            border-radius: 40px;
            font-weight: bold;
            transition: box-shadow 1s;
        }

        #subscribeBtn:hover{
            background-color: rgb(179, 18, 18);
        }

        #joinBtn:hover{
            background-color: rgb(43, 168, 226);
            color: white;
        }

        #tweetBtn:hover{
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.329);
        }
    </style>
</head>
<body>
    <button id="subscribeBtn">SUBSCRIBE</button>
    <button id="joinBtn">JOIN</button>
    <button id="tweetBtn">Tweet</button>
</body>
</html>

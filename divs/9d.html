<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .main{
            background-color: rgba(0, 0, 0, 0.822);
            height: 90px;
            padding : 10px;
            width: 300px;
        }

        .install{
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            font-weight: bold;
            margin-left: 10px;
            margin-right: 10px;
            margin-bottom: 5px;
        }

        .info{
            color: grey;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            margin-left: 10px;
            margin-right: 10px;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="main">
        <p class="install">
            Install YouTube Music
            <div class="info">
                Add YouTube Music to your desktop for quick and
                easy access
            </div>
        </p>
    </div>
</body>
</html>

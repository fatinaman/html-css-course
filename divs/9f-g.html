<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            display: inline-block;
            width: 150px;
            height: 250px;
            border-style: none;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.247);
            margin: 10px;
        }
        img{
            width: 100%;
            height: 60%;
            object-fit: cover;
        }
        .info{
            padding: 5px 7px;
        }
        .name{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding-bottom: 5px;
            margin: 0px;
        }

        .friends{
            font-family: Arial, Helvetica, sans-serif;
            color : rgba(0, 0, 0, 0.596);
            padding-bottom: 10px;
            margin: 0px;
        }

        button{
            background-color: rgb(29, 79, 243);
            color: white;
            border-style: none;
            border-radius: 3px;
            padding: 7px 9px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../images-textboxes/cool-cat.jpg" alt="">
        <div class="info">
            <p class="name">
                Oliver
            </p>

                2 mutual friends
            </p>
            <button>Add Friend</button>
        </div>
    </div>

        <div class="container">

</html>

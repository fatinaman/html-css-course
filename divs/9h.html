<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Page</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
</style>
<style>
    body{
        font-family: Roboto, Arial;
        font-weight: bold;
    }
    img{
        width: 250px;
        margin: 10px;
    }
    input{
        border-radius: 14px;
        width: 500px;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.178);
        border-style: none;
        padding: 10px;
        margin: 30px;
    }

    button{
        background-color: rgba(211, 211, 211, 0.616);
        padding : 10px 20px;
        border-style: none;
        margin: 5px;
    }

    body{
        text-align: center;
    }
</style>
</head>
<body>
    <div class="logoContainer">
        <img src="GoogleLogoSept12015.png" alt="logo of google">
    </div>
    <div class="searchBar">
        <input type="text" placeholder="Search Google or Type a URL">
    </div>
    <div class="addiBtn">
        <button class="gs">
            Google Search
        </button>
        <button class="lucky">
            I'm Feeling Lucky
        </button>
    </div>
</body>
</html>
